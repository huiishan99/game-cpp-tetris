name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core-tests:
    name: Core tests on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure CMake
        if: runner.os != 'Windows'
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Configure Windows CMake
        if: runner.os == 'Windows'
        run: cmake -S . -B build -A x64

      - name: Build
        run: cmake --build build --config Release

      - name: Run tests
        run: ctest --test-dir build --build-config Release --output-on-failure --verbose

      - name: Package Windows build
        if: runner.os == 'Windows'
        run: cmake --install build --config Release --prefix dist/tetris-windows-x64

      - name: Exercise packaged Windows gameplay
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tests/windows_package_smoke.ps1 -PackageDirectory dist/tetris-windows-x64 -EvidenceDirectory build/test-evidence/packaged-app

      - name: Upload Windows test evidence
        if: always() && runner.os == 'Windows'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tetris-windows-test-evidence
          path: build/test-evidence/
          if-no-files-found: warn
          retention-days: 30

      - name: Upload Windows build
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tetris-windows-x64
          path: dist/tetris-windows-x64/
          if-no-files-found: error
          retention-days: 30

